[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heart-stroke-prediction"
version = "0.1.0"
description = "A machine learning system for heart stroke risk stratification"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pytest>=9.1.1",
]

[dependency-groups]
dev = []

[tool.setuptools.packages.find]
where = ["src"]
