
name: Markdown Quality

on:
  pull_request:
    paths:
      - "docs/**/*.md"
      - "research/**/*.md"
      - "project-management/**/*.md"
      - ".pre-commit-config.yaml"
      - ".github/workflows/markdown-quality.yml"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: markdown-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  markdown-quality:
    name: Markdown and spelling checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pre-commit
        run: python -m pip install pre-commit

      - name: Run spelling and Markdown checks
        run: |
          pre-commit run --all-files
